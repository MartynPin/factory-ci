# Мердж выполняет код, а не агент. Срабатывает по метке `approved`,
# которую ставит владелец.
#
# Ставится в продуктовый репозиторий (не reusable): мердж — операция над
# конкретным репозиторием, и права на неё не должны утекать через вызов.
name: merge-bot

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  merge:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Проверить вердикт на ТЕКУЩЕМ SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Защита от гонки: апрув мог быть поставлен до последнего push.
          # Проверяем состояние на том SHA, который сейчас в голове ветки.
          sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          echo "Текущий SHA: $sha"

          state=$(gh api "repos/$REPO/commits/$sha/check-runs" \
                    -q '.check_runs[] | select(.name=="verdict") | .conclusion' | head -1)
          echo "verdict: ${state:-нет}"

          if [ "$state" != "success" ]; then
            gh pr comment "$PR" --repo "$REPO" --body \
              "Мердж отклонён: на текущем коммите \`$sha\` проверка \`verdict\` в состоянии \`${state:-отсутствует}\`. Апрув мог быть поставлен до последнего push — снимите метку \`approved\` и поставьте заново после зелёных гейтов."
            gh pr edit "$PR" --repo "$REPO" --remove-label approved
            exit 1
          fi

      - name: Отказ при метке env_fail
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          if echo "$labels" | grep -qx "env_fail"; then
            echo "::error::На PR метка env_fail. Сломанное окружение не повод мерджить."
            gh pr edit "$PR" --repo "$REPO" --remove-label approved
            exit 1
          fi

      - name: Мердж
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
