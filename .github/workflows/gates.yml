# Гейты фабрики. Вызывается из продуктового репозитория по SHA:
#
#   uses: OWNER/factory-ci/.github/workflows/gates.yml@<40-символьный SHA>
#
# Единственная обязательная проверка в branch protection — джоба `verdict`.
# Остальные джобы могут добавляться и убираться без правки настроек ветки.
name: gates

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      run-e2e:
        type: boolean
        default: true
      run-unit:
        type: boolean
        default: true

# Пустой набор по умолчанию: каждая джоба добавляет себе ровно то, что нужно.
permissions: {}

jobs:
  # --- Предполёт. Отдельная джоба, потому что её провал — не провал работы ---
  preflight:
    needs: [deps-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Установка зависимостей без чужих скриптов
        shell: bash
        run: |
          # PR не может сам разрешить install scripts через свой package.json.
          # Необходимые генераторы вызываются явно после deps-guard.
          npm ci --ignore-scripts
          echo "Install scripts отключены. Allowlist из head-версии продукта не исполняется."
      # Подготовка базы. Дублируется в трёх джобах намеренно: reusable workflow
      # исполняется в контексте вызывающего репозитория, поэтому composite
      # action из factory-ci здесь недоступен, а `uses:` не принимает выражений.
      - name: Подготовка базы
        shell: bash
        run: |
          [ -f prisma/schema.prisma ] || { echo "Prisma не используется."; exit 0; }
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          export DATABASE_URL="${DATABASE_URL:-file:./dev.db}"
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - id: run
        shell: bash
        run: |
          # Не исполняем product-defined scripts/preflight.sh: автор PR не
          # должен определять результат предполёта. Проверяем только
          # установленное дерево и инструменты из зафиксированного lockfile.
          npm ls --depth=0
          if [ -f prisma/schema.prisma ]; then
            npx --no-install prisma validate
          fi
          echo "status=ok" >> "$GITHUB_OUTPUT"

  # --- Дифф зависимостей проверяется РАНЬШЕ установки (F-24) ----------------
  # Смысл в порядке: postinstall выполняется в момент установки, поэтому
  # проверять изменения зависимостей после неё бессмысленно — чужой код уже
  # отработал. Джобы, которые ставят пакеты, ждут эту.
  deps-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Изменения package.json и lockfile
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Не pull_request — сравнивать нечего."; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          pkg=$(printf '%s\n' "$changed" | grep -c '^package\.json$' || true)
          lock=$(printf '%s\n' "$changed" | grep -c '^package-lock\.json$' || true)

          if [ "$pkg" = 0 ] && [ "$lock" = 0 ]; then
            echo "Зависимости не менялись."; exit 0
          fi

          echo "::error title=Зависимости изменены::Обычный продуктовый PR не может менять package.json или lockfile. Требуется отдельное изменение владельца с review supply chain и новым пином factory-ci."
          exit 1

  checks:
    needs: [preflight, deps-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, typecheck, unit, build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Установка зависимостей без чужих скриптов
        shell: bash
        run: |
          # PR не может сам разрешить install scripts через свой package.json.
          # Необходимые генераторы вызываются явно после deps-guard.
          npm ci --ignore-scripts
          echo "Install scripts отключены. Allowlist из head-версии продукта не исполняется."
      # Подготовка базы. Дублируется в трёх джобах намеренно: reusable workflow
      # исполняется в контексте вызывающего репозитория, поэтому composite
      # action из factory-ci здесь недоступен, а `uses:` не принимает выражений.
      - name: Подготовка базы
        shell: bash
        run: |
          [ -f prisma/schema.prisma ] || { echo "Prisma не используется."; exit 0; }
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          export DATABASE_URL="${DATABASE_URL:-file:./dev.db}"
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - name: ${{ matrix.gate }}
        shell: bash
        run: |
          case "${{ matrix.gate }}" in
            lint)
              npx --no-install eslint . ;;
            typecheck)
              [ ! -x node_modules/.bin/next ] || npx --no-install next typegen
              npx --no-install tsc --noEmit ;;
            unit)
              if [ "${{ inputs.run-unit }}" != "true" ]; then
                echo "unit-тесты явно отключены защищённым caller workflow"
              elif ! find tests/unit -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print -quit 2>/dev/null | grep -q .; then
                echo "::error::run-unit=true, но unit-тестов нет"
                exit 1
              else
                npx --no-install vitest run
              fi ;;
            build)
              npx --no-install next build ;;
          esac

  e2e:
    needs: [preflight, deps-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Установка зависимостей без чужих скриптов
        shell: bash
        run: |
          # PR не может сам разрешить install scripts через свой package.json.
          # Необходимые генераторы вызываются явно после deps-guard.
          npm ci --ignore-scripts
          echo "Install scripts отключены. Allowlist из head-версии продукта не исполняется."
      # Подготовка базы. Дублируется в трёх джобах намеренно: reusable workflow
      # исполняется в контексте вызывающего репозитория, поэтому composite
      # action из factory-ci здесь недоступен, а `uses:` не принимает выражений.
      - name: Подготовка базы
        shell: bash
        run: |
          [ -f prisma/schema.prisma ] || { echo "Prisma не используется."; exit 0; }
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          export DATABASE_URL="${DATABASE_URL:-file:./dev.db}"
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - name: e2e
        shell: bash
        run: |
          if [ "${{ inputs.run-e2e }}" != "true" ]; then
            echo "e2e явно отключены защищённым caller workflow"; exit 0
          fi
          if ! ls tests/e2e/*.spec.ts >/dev/null 2>&1; then
            echo "::error::run-e2e=true, но e2e-тестов нет"; exit 1
          fi
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test

  # --- Проверки диффа ------------------------------------------------------
  # Код проверок живёт ЗДЕСЬ, а не в продуктовом репозитории. Reusable workflow
  # исполняется в контексте вызывающего репозитория, поэтому файлы factory-ci
  # там недоступны, а второй checkout потребовал бы токена на приватный репо —
  # ровно того секрета, которого у джоб гейтов быть не должно.
  diff-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Список изменённых файлов
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Не pull_request — проверки диффа пропускать нельзя, но сравнивать нечего."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" "$head" > /tmp/changed.txt
          echo "Изменено файлов: $(wc -l < /tmp/changed.txt)"
          cat /tmp/changed.txt

      - name: Безопасные имена файлов
        shell: bash
        run: |
          [ -f /tmp/changed.txt ] || { echo "::error::Нет списка изменённых файлов"; exit 1; }
          bad=0
          while IFS= read -r f; do
            if ! [[ "$f" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Недопустимое имя файла в PR"
              bad=1
            fi
          done < /tmp/changed.txt
          exit "$bad"

      - name: Тесты нельзя удалить или ослабить количеством
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Не pull_request — сравнение тестов не применяется."
            exit 0
          fi
          if git diff --name-only --diff-filter=DR "$base" "$head" -- tests/ | grep -q .; then
            echo "::error::Удаление или переименование тестового файла запрещено в обычном PR."
            exit 1
          fi
          before_tests=$({ git grep -E '\b(it|test|describe)\s*\(' "$base" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          after_tests=$({ git grep -E '\b(it|test|describe)\s*\(' "$head" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          before_asserts=$({ git grep -E '\b(expect|assert)\s*\(' "$base" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          after_asserts=$({ git grep -E '\b(expect|assert)\s*\(' "$head" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          echo "tests: $before_tests -> $after_tests; assertions: $before_asserts -> $after_asserts"
          [ "$after_tests" -ge "$before_tests" ] || { echo "::error::Количество тестов уменьшилось"; exit 1; }
          [ "$after_asserts" -ge "$before_asserts" ] || { echo "::error::Количество assertions уменьшилось"; exit 1; }

      - name: Защищённые пути
        shell: bash
        run: |
          [ -f /tmp/changed.txt ] || exit 0
          # Эти пути закрыты для изменения через PR. Единственное исключение —
          # обновление пина factory-ci: смена SHA в строке `uses:` при
          # неизменном адресе workflow. Урок L-011: прямой push в main закрыт
          # защитой ветки, поэтому без этого исключения `.github/*` нельзя
          # изменить НИКАК, включая владельцу, и CI застывает навсегда.
          bad=0
          while read -r f; do
            case "$f" in
              AGENTS.md|CLAUDE.md|package.json|package-lock.json|docs/adr/*|*secret*|*.pem|.env|.env.*|eslint.config.*|tsconfig.json|vitest.config.*|playwright.config.*|security-baseline.json|lighthouse-budget.json|scripts/gates.sh|scripts/preflight.sh|scripts/apply-overlay.mjs|scripts/contract-guard.mjs)
                echo "::error file=$f::Защищённый путь. Изменение возможно только отдельным PR владельца."
                bad=1 ;;
              .github/*)
                if ! node - "$f" "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" <<'NODE'
          const { execFileSync } = require("child_process");
          const [file, base, head] = process.argv.slice(2);
          const diff = execFileSync("git", ["diff", "-U0", base, head, "--", file], { encoding: "utf8" });

          const lines = diff.split("\n").filter(l => /^[+-]/.test(l) && !/^(\+\+\+|---)/.test(l));
          const added   = lines.filter(l => l[0] === "+").map(l => l.slice(1).trim());
          const removed = lines.filter(l => l[0] === "-").map(l => l.slice(1).trim());

          // Допустима ровно одна форма строки: uses: <адрес>@<40 hex>.
          const PIN = /^uses:\s*(\S+)@([0-9a-f]{40})$/;
          const parse = (arr) => {
            const out = [];
            for (const l of arr) {
              const m = l.match(PIN);
              if (!m) return null;
              out.push(m[1]);
            }
            return out;
          };

          const a = parse(added), r = parse(removed);
          if (!a || !r) { console.log("Изменены не только строки пина."); process.exit(1); }

          // Адрес workflow меняться не должен: иначе подменяется сам источник
          // проверок, а не его версия.
          if (a.length !== r.length || a.some((x, i) => x !== r[i])) {
            console.log("Изменён адрес вызываемого workflow, а не только его версия.");
            process.exit(1);
          }
          console.log("Изменение сводится к обновлению SHA: " + a.join(", "));
          NODE
                  then
                    echo "::error file=$f::Защищённый путь. Через PR допустимо только обновление SHA в строке uses: при неизменном адресе workflow."
                    bad=1
                  else
                    echo "::notice file=$f::Обновление пина. Адрес workflow не изменён."
                  fi ;;
            esac
          done < /tmp/changed.txt
          exit "$bad"

      - name: Ослабление проверок
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          [ -f /tmp/changed.txt ] || exit 0
          node - "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const changed = fs.readFileSync("/tmp/changed.txt", "utf8")
            .split("\n").map(s => s.trim()).filter(Boolean);

          // Список check-config. Обязан пополняться при добавлении любого
          // нового инструмента проверки: инструмент, чей конфиг не в списке,
          // выведен из-под контроля.
          const CONFIG = [
            /^eslint\.config\./, /^tsconfig\.json$/, /^vitest\.config\./,
            /^playwright\.config\./, /^security-baseline\.json$/,
            /^scripts\/gates\.sh$/, /^scripts\/preflight\.sh$/,
            /^scripts\/apply-overlay\.mjs$/,
            /^scripts\/contract-guard\.mjs$/,
          ];

          const hits = changed.filter(f => CONFIG.some(re => re.test(f)));

          // Ослабление внутри кода проверок: скипы, only, подавление типов.
          const suspicious = [];
          for (const f of changed) {
            if (!/\.(ts|tsx|js|mjs)$/.test(f)) continue;
            let diff = "";
            try {
              diff = execFileSync("git", ["diff", "-U0", process.argv[2], process.argv[3], "--", f],
                                  { encoding: "utf8" });
            } catch (error) {
              console.error("Не удалось безопасно прочитать diff: " + error.message);
              process.exit(1);
            }
            const added = diff.split("\n").filter(l => l.startsWith("+") && !l.startsWith("+++"));
            for (const line of added) {
              if (/\.(skip|only)\s*\(/.test(line) ||
                  /\b(xit|xdescribe|it\.todo)\b/.test(line) ||
                  /@ts-expect-error|@ts-ignore/.test(line) ||
                  /eslint-disable/.test(line)) {
                suspicious.push(`${f}: ${line.slice(1).trim()}`);
              }
            }
          }

          if (hits.length === 0 && suspicious.length === 0) {
            console.log("Конфигурация проверок не затронута.");
            process.exit(0);
          }

          console.log("Затронуты проверки:");
          hits.forEach(h => console.log("  конфиг: " + h));
          suspicious.forEach(s => console.log("  в коде: " + s));

          // Текст пишет контролируемая сторона, поэтому он не может менять
          // красный результат механической проверки на зелёный.
          console.log("");
          console.log("::error title=Ослабление проверок::Изменение safeguards требует отдельного контролируемого owner change.");
          process.exit(1);
          NODE

      - name: Сужение контракта
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Урок L-009. Новое ОБЯЗАТЕЛЬНОЕ свойство в типе, который уже
          # использовали чужие тесты, ломает их. typecheck это ловит, но
          # сообщением TS2769 в чужом файле — причина не названа.
          if [ ! -f scripts/contract-guard.mjs ]; then
            echo "::error title=Проверка контракта отсутствует::Обязательный scripts/contract-guard.mjs отсутствует."
            exit 1
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Не pull_request — сравнивать нечего."
            exit 0
          fi

          if out=$(node scripts/contract-guard.mjs "$base" "$head" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"

          echo "::error title=Сужение контракта::Текст PR не может переопределить красный гейт. Требуется отдельное контролируемое изменение контракта владельцем."
          exit 1

  # --- Единственная обязательная проверка ----------------------------------
  verdict:
    needs: [preflight, deps-guard, checks, e2e, diff-guards]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Разбор результатов
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          PREFLIGHT_STATUS: ${{ needs.preflight.outputs.status }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
          GUARDS: ${{ needs.diff-guards.result }}
          DEPS: ${{ needs.deps-guard.result }}
        run: |
          echo "предполёт: $PREFLIGHT ($PREFLIGHT_STATUS)"
          echo "гейты:     $CHECKS"
          echo "e2e:       $E2E"
          echo "дифф:      $GUARDS"
          echo "зависимости: $DEPS"
          {
            echo "## Factory CI verdict"
            echo
            echo "| Проверка | Результат |"
            echo "|---|---|"
            echo "| preflight | $PREFLIGHT |"
            echo "| dependencies | $DEPS |"
            echo "| checks | $CHECKS |"
            echo "| e2e | $E2E |"
            echo "| diff guards | $GUARDS |"
            echo
            echo "Exact commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PREFLIGHT_STATUS" = "env_fail" ]; then
            echo "::error title=env_fail::Отказ окружения. Попытка задачи НЕ засчитывается, ретрай не запускать."
            echo "ENVFAIL=1" >> "$GITHUB_ENV"
            exit 1
          fi

          bad=0
          for r in "$PREFLIGHT" "$DEPS" "$CHECKS" "$E2E" "$GUARDS"; do
            # skipped засчитывается как провал: пропущенная проверка ничего не проверила
            [ "$r" = "success" ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "::error::Есть непройденные проверки."; exit 1; }
          echo "Все проверки пройдены."
